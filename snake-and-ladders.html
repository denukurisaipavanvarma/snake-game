<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake and Ladders Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="snake-and-ladders.css">
</head>
<body>
    <div class="container-fluid game-container">
        <h1 class="text-center game-title">Snake and Ladders</h1>
        
        <div class="row">
            <!-- Player Information Panels -->
            <div class="col-md-3">
                <div class="player-panel" id="player1Panel">
                    <h3>Player 1</h3>
                    <div class="player-token p1-token"></div>
                    <p>Position: <span id="player1Pos">1</span></p>
                </div>
            </div>

            <!-- Game Board -->
            <div class="col-md-6">
                <div class="game-board" id="gameBoard">
                    <!-- Board squares will be generated by JavaScript -->
                </div>
            </div>

            <!-- Player 2 Panel -->
            <div class="col-md-3">
                <div class="player-panel" id="player2Panel">
                    <h3>Player 2</h3>
                    <div class="player-token p2-token"></div>
                    <p>Position: <span id="player2Pos">1</span></p>
                </div>
            </div>
        </div>

        <!-- Dice Rolling Section -->
        <div class="row mt-4">
            <div class="col-12 text-center">
                <div class="dice-section">
                    <div class="dice" id="dice">1</div>
                    <button class="btn btn-primary roll-button" id="rollButton">Roll Dice</button>
                </div>
                <div class="game-message" id="gameMessage"></div>
            </div>
        </div>
    </div>

    <script src="snake-and-ladders.js"></script>
</body>
</html>
